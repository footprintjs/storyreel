name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      # The whole suite with a temp folder of its own; nothing may be left in it (scripts/temp-hygiene.mjs).
      - run: npm run test:temp
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack --profile esm-only --entrypoints . clock pacing ease pins sheet render segments pipeline approval film strings theme reading shots regions review slideshow geometry claims decorative tools motion attention captions layout transitions camera beats music moves principles breakdown acting finished listening release kits/whiteboard kits/cartoon studio  # the typed entry points (README: the drawing internals are untyped)

  # The renders the skills describe, as written: the farm film's small draft, its approval and the final, and the
  # approval refusing a changed kit (test/skills-render.mjs; locally `npm run test:skills:render`, kept out of npm test).
  skills-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run test:skills:render
