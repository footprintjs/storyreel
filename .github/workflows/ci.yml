name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The suite in three parts at once, about equal in time (scripts/test-files.mjs, by test/slow-files.json).
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4   # ffmpeg's packages: the mirror can be very slow, and apt checks each one's hash, so a saved copy is safe
        with:
          path: ~/apt-ffmpeg
          key: ci-apt-ffmpeg-ubuntu-24.04-v1
      - run: |
          mkdir -p ~/apt-ffmpeg/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$HOME/apt-ffmpeg" ffmpeg
          sudo chown -R "$USER" ~/apt-ffmpeg
        timeout-minutes: 25
      - run: npm ci
      # The whole suite with a temp folder of its own; nothing may be left in it (scripts/temp-hygiene.mjs).
      - run: npm run test:temp -- $(node scripts/test-files.mjs --shard ${{ matrix.shard }}/3)
      - run: npx publint
        if: matrix.shard == 1
      # Every typed entry point, from package.json (scripts/typed-entrypoints.mjs): the same list here and in publish.yml.
      - if: matrix.shard == 1
        run: npx @arethetypeswrong/cli --pack --profile esm-only --entrypoints $(node scripts/typed-entrypoints.mjs)

  # The renders the skills describe, as written: the farm film's small draft, its approval and the final, and the
  # approval refusing a changed kit (test/skills-render.mjs; locally `npm run test:skills:render`, kept out of npm test).
  skills-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4   # ffmpeg's packages: the mirror can be very slow, and apt checks each one's hash, so a saved copy is safe
        with:
          path: ~/apt-ffmpeg
          key: ci-apt-ffmpeg-ubuntu-24.04-v1
      - run: |
          mkdir -p ~/apt-ffmpeg/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$HOME/apt-ffmpeg" ffmpeg
          sudo chown -R "$USER" ~/apt-ffmpeg
        timeout-minutes: 25
      - run: npm ci
      - run: npm run test:skills:render
