<!doctype html><html lang="en"><meta charset="utf-8"><title>Preferences</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3f0;color:#292334;font:24px Arial,sans-serif}.top{height:84px;background:#fff;border-bottom:1px solid #ddd7e2;padding:28px 60px;font-weight:700}.badge{float:right;font-size:16px;color:#746b7d}main{width:760px;margin:64px auto;background:white;padding:42px;border-radius:20px;box-shadow:0 8px 35px #25203912}h1{margin:0 0 12px;font-size:36px}p{color:#726a7b;font-size:20px;line-height:1.5}label{display:block;margin:28px 0 12px;font-size:19px;font-weight:700}input{width:100%;border:2px solid #c9c1d0;border-radius:10px;font:26px Arial;padding:15px}footer{display:flex;justify-content:flex-end;margin-top:24px}button{background:#6b4de6;color:white;border:0;border-radius:10px;font:700 20px Arial;padding:16px 30px;cursor:pointer}button:hover{background:#5437ce}.alert{padding:18px;border-radius:9px;background:#fff0ef;color:#ad3430;font-size:19px;border:1px solid #efc4c1;line-height:1.5}.hidden{display:none}
.playback{margin-top:26px;font-size:15px;color:#645d6a}.track{margin-top:10px;background:#e8ecea;overflow:hidden;border-radius:10px;height:52px}.marker{width:180px;height:52px;background:#398570;border-radius:10px;animation:travel 12s linear infinite alternate}@keyframes travel{from{transform:translateX(0)}to{transform:translateX(496px)}}
</style><header class="top">Preferences<span class="badge">LOCAL INTERFACE PROTOTYPE</span></header><main><h1>Set a spending limit</h1><p>A positive amount is required before this change can be saved.</p><form><label for="amount">Amount</label><input id="amount" type="number" value="-1"><footer><button type="submit">Save changes</button></footer><div id="notice" class="alert hidden" role="alert">Please enter a positive amount. Nothing was saved.</div></form><section class="playback">Local playback marker — for seeing holds and playback speed<div class="track"><div class="marker"></div></div></section></main><script>document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();const amount=Number(document.querySelector('input').value);const notice=document.querySelector('#notice');notice.classList.remove('hidden');notice.textContent=amount>0?'The local form accepted this amount.':'Please enter a positive amount. Nothing was saved.';});</script></html>
